<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Song Maker</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <script>
      window.dataLayer = window.dataLayer || [];
    </script>
    <link
      href="https://www.gstatic.com/glue/cookienotificationbar/cookienotificationbar.min.css"
      rel="stylesheet"
    />

    <link href="/assets/css/composite/build.css" rel="stylesheet" />
    <link href="/assets/css/composite/composite.css" rel="stylesheet" />

    <link rel="shortcut icon" href="assets/favico.png" type="image/x-icon" />
    <link rel="canonical" href="" />

    <link rel="icon" sizes="192x192" href="assets/icon.png" />
    <script>
      window.dataLayer = window.dataLayer || [];
    </script>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
  </head>
  <body>
    <nav class="navbar">
      <button class="nav-btn" onclick="location.href='/'">← Back</button>
      <span class="nav-title">Song Maker</span>
      <div
        style="
          display: flex;
          flex-direction: row;
          align-items: center;
          gap: 20px;
        "
      >
        <button class="nav-btn" onclick="location.href='/metronome/help'">
          Help
        </button>
      </div>
    </nav>
    <div style="width: 100%;">
      <div class="wave-back">
        <div class="wave-anim">
          <div class="inner-wave-anim"></div>

          <!-- Waves SVG -->
          <div>
            <svg
              class="waves"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 24 150 28"
              preserveAspectRatio="none"
            >
              <defs>
                <path
                  id="gentle-wave"
                  d="M-160 44c30 0 58-18 88-18s58 18 88 18 58-18 88-18
                     58 18 88 18 v44h-352z"
                />
              </defs>
              <g class="parallax">
                <use
                  xlink:href="#gentle-wave"
                  x="48"
                  y="0"
                  fill="rgba(255,255,255,0.7)"
                />
                <use
                  xlink:href="#gentle-wave"
                  x="48"
                  y="3"
                  fill="rgba(255,255,255,0.5)"
                />
                <use
                  xlink:href="#gentle-wave"
                  x="48"
                  y="5"
                  fill="rgba(255,255,255,0.3)"
                />
                <use xlink:href="#gentle-wave" x="48" y="7" fill="#fff" />
              </g>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <div class="container">
      <div id="cursor" class="cursor hide"></div>
      <div class="note-container" id="note_area">
        <div id="notation"></div>
        <div class="note-group" id="note_group"></div>
        <div class="dynamics-container" id="dynamics_container"></div>
      </div>
    </div>
    <div id="bottom">
      <div id="bottom-left">
        <button id="play-button" class="">Play</button>
        <button class="button add-measure" id="add_measure">Measure</button>
        <!-- <button class="button remove-measure" id="remove_measure">- Measure</button> -->
      </div>
      <div style="display: flex; align-items: center; gap: 12px; width: 100%; justify-content: center; margin-bottom: 8px; margin: 15px 0; flex-direction: column;">
        <div style="width: 200px;">
          <span id="tempo-italian" class="tempo-term-label" style="font-size: 1.5em;">Allegro</span>
        </div>
        <div style="width: 260px; display: flex;">
          <label for="tempo_slider" style="font-weight: 500; color: #888; font-size: 1.5em;">Tempo</label>
          <input id="tempo_slider" type="range" min="40" max="208" value="120" style="width: 200px; margin: 0 20px;">
          <span id="bpm-value" style="font-size: 1.1em; color: #0074d9; margin-left: 4px; font-size: 1.5em;">120</span>
        </div>
      </div>
      <div id="bottom-right">
        <!-- <button id="midi-button" class="button">Midi</button> -->
        <!-- <button id="mic-button" class="button visible">Mic</button> -->
        <button id="reset-button" class="button">Restart</button>
        <!-- <button id="settings-button" class="button">Settings</button> -->
        <!-- <button id="undo-button" class="button">Undo</button> -->
        <!-- <button id="save-button" class="button">Save</button> -->
      </div>
    </div>
    <div id="measureModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2 style="margin-bottom: 30px;">Select Number of Measures</h2>
        <button class="model-button" id="4measuresBtn">4 Measures</button>
        <button class="model-button" id="8measuresBtn">8 Measures</button>
      </div>
    </div>
    <script src="http://unpkg.com/tone"></script>
    <script src="/assets/js/composite/data/SongOptions.js" type="module"></script>
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>
    <script src="/assets/js/composite/composite.js" type="module"></script>
  </body>
</html>
